name: Browser and Studio acceptance
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: abhyaas
          POSTGRES_USER: abhyaas
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U abhyaas -d abhyaas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: "postgresql://abhyaas:ci-password@localhost:5432/abhyaas"
      DEMO_PASSWORD: "CI-only-demo-password"
      AUTH_SECRET: "CI-only-secret-that-is-not-used-on-live-users"
      OPENAI_API_KEY: ""
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Install headless browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Create fresh database and original demo data
        run: npm run db:setup
      - name: Compile app
        run: npm run build
      - name: Start app locally
        run: |
          npm run start > /tmp/abhyaas-next-browser.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/abhyaas-next-browser.log
          exit 1
      - name: Real-browser student flows
        run: npm run test:browser
      - name: Administrator reviewed-content publishing
        run: npm run test:studio
      - name: Print app logs on failure
        if: failure()
        run: tail -100 /tmp/abhyaas-next-browser.log || true
      - name: Save browser screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: abhyaas-browser-failure
          path: /tmp/abhyaas-browser-failure.png
          if-no-files-found: ignore
